<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Florvae</title>
  <meta name="description" content="Florvae — landing pages hub.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/everlove/logo.webp">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/_shared/base.css">
  <style>
    body { display: flex; min-height: 100vh; align-items: center; justify-content: center; background: var(--bg-soft); }
    .hub { text-align: center; padding: 40px 20px; }
    .hub h1 { font-size: 28px; letter-spacing: .12em; text-transform: uppercase; }
    .hub p { color: var(--muted); margin-bottom: 26px; }
    .hub .brands { display: grid; gap: 12px; max-width: 340px; margin: 0 auto; }
  </style>
</head>
<body>
  <!-- Simple multi-brand hub. Each brand lives at /<slug>/. Add more links as you launch. -->
  <div class="hub">
    <h1>Florvae</h1>
    <p>Brand landing pages</p>
    <div class="brands">
      <a class="btn btn--block" href="/everlove/">Everlove Mascara →</a>
    </div>
  </div>
</body>
</html>
